<div class="ss-sticky">
  <div class="in">
    <div class="info">
      <div class="name">4D Lipedema Leggings</div>
      <div class="sub"><span class="st">★★★★★</span> 4.7 · Buy 1, Get 1 FREE Today</div>
    </div>
    <a class="cta" href="#ss-buy">Check Availability</a>
  </div>
</div>
<script>
(function(){
  var bars=document.querySelectorAll('.ss-sticky');
  if(bars.length>1){for(var i=1;i<bars.length;i++){bars[i].remove();}}
  var b=document.querySelector('.ss-sticky');
  if(b&&!b.dataset.ssBound){
    b.dataset.ssBound="1";
    var t=function(){var a=document.querySelector('.acc');var trig=a?(a.getBoundingClientRect().bottom+window.pageYOffset):900;b.classList.toggle('show',window.scrollY>trig);};
    window.addEventListener('scroll',t,{passive:true});t();
  }
  // Smooth-scroll every "Check Availability" / #ss-buy CTA to the bundle selector
  if(!window.__ssScrollBound){
    window.__ssScrollBound=1;
    document.addEventListener('click',function(e){
      var a=e.target.closest('a[href="#ss-buy"], a[href="#ss-buy"] *');
      if(!a)a=e.target.closest('.ss-sticky a.cta');
      if(!a)return;
      var tgt=document.getElementById('ssTiers')||document.querySelector('.ssbb')||document.getElementById('ss-buy');
      if(tgt){e.preventDefault();var y=tgt.getBoundingClientRect().top+window.pageYOffset-72;window.scrollTo({top:y,behavior:'smooth'});}
    },false);
  }
})();
</script>
<style>
.ss-lp .reveal{opacity:0;transform:translateY(24px);transition:opacity .8s cubic-bezier(.16,1,.3,1),transform .8s cubic-bezier(.16,1,.3,1)}
.ss-lp .reveal.in{opacity:1;transform:none}
.ss-lp .h-img img,.ss-lp .p-img,.ss-lp .zig .z-img{transition:transform .7s cubic-bezier(.16,1,.3,1)}
.ss-lp .h-img:hover img,.ss-lp .problem-grid:hover .p-img,.ss-lp .zig:hover .z-img{transform:scale(1.02)}
@media(prefers-reduced-motion:reduce){.ss-lp .reveal{opacity:1;transform:none;transition:none}}
</style>
<script>(function(){
 var els=document.querySelectorAll('.ss-lp .h-head,.ss-lp .h-body,.ss-lp .problem-grid>*,.ss-lp .mech .sec-head,.ss-lp .zig,.ss-lp .grid6 .sec-head,.ss-lp .mech .cta-zone');
 if(!els.length)return;
 els.forEach(function(e,i){e.classList.add('reveal');e.style.transitionDelay=((i%2)*100)+'ms';});
 if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in');});return;}
 var io=new IntersectionObserver(function(en){en.forEach(function(x){if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target);}});},{threshold:.12,rootMargin:'0px 0px -6% 0px'});
 els.forEach(function(e){io.observe(e);});
})();</script>

  </div>
</div>
