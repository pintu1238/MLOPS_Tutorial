mutation {
  productCreate(
    product: {
      title: "Camel crewneck"
      vendor: "Girls Winter"
      productType: "Pullovers"
      status: ACTIVE
      collectionsToJoin: ["gid://shopify/Collection/316935405637"]
    }
    media: [{ originalSource: "https://shopify-staged-uploads.storage.googleapis.com/tmp/76497158213/files/b75528b0-2254-4aac-bcde-dc3c05ddbd54/gw-pullover-2.jpg", mediaContentType: IMAGE, alt: "Woman in a camel crewneck pullover" }]
  ) {
    product { id title variants(first: 1) { nodes { id } } }
    userErrors { field message }
  }
}